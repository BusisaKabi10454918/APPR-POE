name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.400'   
        
    - name: Restore dependencies
      run: dotnet restore APPR_POE_PART_1_prototype.csproj

    - name: Build solution
      run: dotnet build APPR_POE_PART_1_prototype.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test APPR_POE_PART_1_prototype.csproj --configuration Release --no-build --verbosity normal
